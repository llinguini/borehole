[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/cli",
    "crates/server",
]

# Shared package metadata inherited by every member via `field.workspace = true`.
[workspace.package]
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
rustls = "0.23"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
owo-colors = "4"
webpki-roots = "0.26"

[profile.release]
opt-level = 3
strip = "symbols"
lto = true
