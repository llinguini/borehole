[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/server",
    "crates/cli",
    "crates/node",
]

# Shared package metadata inherited by every member via `field.workspace = true`.
[workspace.package]
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
# Single crypto backend: ureq's default `rustls` feature enables `ring`, which
# conflicts with tokio-rustls unless a CryptoProvider is installed manually.
rustls = { version = "0.23", default-features = false, features = [
    "aws-lc-rs",
    "logging",
    "std",
    "tls12",
] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
owo-colors = "4"
webpki-roots = "0.26"

[profile.release]
opt-level = 3
strip = "symbols"
lto = true
