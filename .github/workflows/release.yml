name: Release

# Publishes release artifacts when a version tag (e.g. v0.1.0) is pushed:
#   - the `borehole` CLI as standalone binaries (one per target) attached
#     directly to the GitHub Release.
#   - every other component (`borehole-server`, `borehole-node`) as a Docker
#     image in the GitHub Container Registry (ghcr.io), under the repository
#     "Packages" tab. The CLI is intentionally NOT shipped as an image.
on:
  push:
    tags:
      - "v*"

# Least-privilege by default; jobs widen this as needed.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Build the CLI binary natively on each runner. We avoid cross-compilation on
  # purpose: `rustls 0.23` pulls in `aws-lc-sys`, a native (cmake/perl, plus
  # NASM on Windows) backend that is painful to cross-compile.
  # ---------------------------------------------------------------------------
  build-cli:
    name: Build CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: borehole
            asset: borehole-x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            bin: borehole
            asset: borehole-x86_64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: borehole
            asset: borehole-aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: borehole.exe
            asset: borehole-x86_64-pc-windows-msvc.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # musl-gcc is required to link the statically-linked musl target.
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # NASM is required to build aws-lc-sys on Windows.
      - name: Install NASM
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build borehole CLI
        # Inject the tag as the reported version so the binary matches the
        # Release (consumed by build.rs -> BOREHOLE_VERSION).
        env:
          BOREHOLE_VERSION: ${{ github.ref_name }}
        run: >-
          cargo build --release --locked
          -p borehole --target ${{ matrix.target }}

      # Copy the binary out under a per-target name so the Release assets do not
      # collide with each other.
      - name: Stage asset
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" \
            "dist/${{ matrix.asset }}"

      # Stage the binary as a workflow artifact. A single downstream job creates
      # the GitHub Release and uploads every asset at once, avoiding the race
      # when multiple matrix legs call action-gh-release in parallel (finalize
      # fails with tag_name already_exists).
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          retention-days: 1

  # One job owns release creation + all CLI asset uploads (no matrix races).
  release-cli:
    name: Publish CLI release
    needs: build-cli
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only CLI matrix uploads match `borehole-*`. Without a pattern,
      # download-artifact grabs EVERY workflow artifact — including the Docker
      # buildx gha cache blobs (`*.dockerbuild`) — which then fail to extract.
      - name: Download CLI binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: borehole-*
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
          fail_on_unmatched_files: true

  # ---------------------------------------------------------------------------
  # Build and push every non-CLI component as a Docker image to ghcr.io. One
  # matrix job per component (server, node), each tagged independently. Uses the
  # repository-scoped GITHUB_TOKEN, so no extra secrets are required.
  # ---------------------------------------------------------------------------
  docker:
    name: Build & push ${{ matrix.image }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: borehole-server
            dockerfile: docker/Dockerfile.server
          - image: borehole-node
            dockerfile: docker/Dockerfile.node
          - image: borehole-web
            dockerfile: docker/Dockerfile.web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BOREHOLE_VERSION=${{ github.ref_name }}
          # Per-image gha cache scope so server and node don't evict each other.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
