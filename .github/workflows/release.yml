name: Release

# Publishes release artifacts when a version tag (e.g. v0.1.0) is pushed:
#   - the `borehole` CLI as standalone binaries (one per target) attached
#     directly to the GitHub Release.
#   - the `borehole-server` Docker image to the GitHub Container Registry
#     (ghcr.io), where it shows up under the repository "Packages" tab.
on:
  push:
    tags:
      - "v*"

# Least-privilege by default; jobs widen this as needed.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Build the CLI binary natively on each runner. We avoid cross-compilation on
  # purpose: `rustls 0.23` pulls in `aws-lc-sys`, a native (cmake/perl, plus
  # NASM on Windows) backend that is painful to cross-compile.
  # ---------------------------------------------------------------------------
  build-cli:
    name: Build CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # Each matrix job uploads its own binary to the Release, so it needs write
    # access to repository contents.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: borehole
            asset: borehole-x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            bin: borehole
            asset: borehole-x86_64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: borehole
            asset: borehole-aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
            bin: borehole
            asset: borehole-x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: borehole.exe
            asset: borehole-x86_64-pc-windows-msvc.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # musl-gcc is required to link the statically-linked musl target.
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # NASM is required to build aws-lc-sys on Windows.
      - name: Install NASM
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build borehole CLI
        # Inject the tag as the reported version so the binary matches the
        # Release (consumed by build.rs -> BOREHOLE_VERSION).
        env:
          BOREHOLE_VERSION: ${{ github.ref_name }}
        run: >-
          cargo build --release --locked
          -p cli --target ${{ matrix.target }}

      # Copy the binary out under a per-target name so the Release assets do not
      # collide with each other.
      - name: Stage asset
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" \
            "dist/${{ matrix.asset }}"

      # Publish this target's binary to the Release as soon as it is built,
      # instead of waiting for the whole matrix. The action is idempotent:
      # whichever job runs first creates the Release, the rest just add their
      # asset. This avoids a slow runner (e.g. macOS) blocking every upload.
      - name: Publish binary to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset }}
          generate_release_notes: true
          fail_on_unmatched_files: true

  # ---------------------------------------------------------------------------
  # Build and push the server image to ghcr.io. Uses the repository-scoped
  # GITHUB_TOKEN, so no extra secrets are required.
  # ---------------------------------------------------------------------------
  docker:
    name: Build & push server image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/borehole-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BOREHOLE_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
